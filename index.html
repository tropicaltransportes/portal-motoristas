<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1c2a3a">
  <title>Portal do Motorista · Tropical Transportes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:        #1c2a3a;
      --navy-2:      #26384c;
      --green-vivid: #00c038;
      --green-dark:  #06772b;
      --sage:        #c7d291;
      --mint:        #edfff2;
      --ink:         #1c2a3a;
      --ink-2:       #4d555c;
      --line:        #dde5de;
      --ground:      #ffffff;
      --band:        #eef3ef;
      --pending:     #b7c1b9;

      --s-recebida:   #585e63;
      --s-programada: #1557a0;
      --s-andamento:  #b45309;
      --s-aguardando: #b91c1c;
      --s-finalizada: #06772b;
      --s-cancelada:  #455a64;

      --mono: 'DM Mono', ui-monospace, monospace;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Sora', system-ui, sans-serif;
      background: var(--band);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.45;
    }
    ::selection { background: var(--green-vivid); color: var(--navy); }
    :focus-visible { outline: 3px solid var(--green-vivid); outline-offset: 2px; border-radius: 6px; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .icon { width: 1em; height: 1em; flex-shrink: 0; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* ── TOPO ── */
    .topo {
      background: var(--navy);
      position: sticky; top: 0; z-index: 10;
      box-shadow: 0 2px 12px rgba(12, 20, 30, .25);
    }
    .topo-barra {
      height: 60px; padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      max-width: 640px; margin: 0 auto;
    }
    .logo { height: 30px; width: auto; display: block; }
    .trocar {
      background: none; border: 0; color: var(--sage);
      font-size: 14px; font-weight: 600;
      min-height: 44px; padding: 0 4px;
      text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px;
    }

    /* Abas de veículo */
    .veiculos {
      display: flex; gap: 4px; overflow-x: auto;
      padding: 0 12px; max-width: 640px; margin: 0 auto;
      scrollbar-width: none;
    }
    .veiculos::-webkit-scrollbar { display: none; }
    .aba {
      flex-shrink: 0; background: none; border: 0;
      min-height: 52px; padding: 0 14px;
      color: rgba(255, 255, 255, .62);
      font-family: var(--mono); font-size: 17px; font-weight: 500;
      border-bottom: 4px solid transparent;
      display: flex; align-items: center; gap: 8px;
      transition: color .2s, border-color .2s;
    }
    .aba[aria-pressed="true"] { color: #fff; border-bottom-color: var(--green-vivid); }
    .aba .qtd {
      font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 700;
      background: rgba(255, 255, 255, .14); color: #fff;
      border-radius: 99px; min-width: 22px; height: 22px; padding: 0 6px;
      display: inline-grid; place-items: center;
    }
    .aba[aria-pressed="true"] .qtd { background: var(--green-vivid); color: var(--navy); }

    main { max-width: 640px; margin: 0 auto; }

    /* ── ENTRADA ── */
    .entrada { background: var(--navy); color: #fff; padding: 28px 20px 36px; }
    .entrada h1 { font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -.03em; margin-bottom: 10px; text-wrap: balance; }
    .entrada p { font-size: 16px; color: #d6e2d9; margin-bottom: 22px; }
    .entrada label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .campo {
      width: 100%; height: 56px; border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, .35); background: #fff; color: var(--ink);
      padding: 0 16px; font-family: var(--mono); font-size: 17px;
    }
    .campo::placeholder { color: #6b747b; }
    .campo:focus { outline: none; border-color: var(--green-vivid); box-shadow: 0 0 0 4px rgba(0, 192, 56, .3); }
    .campo[aria-invalid="true"] { border-color: #ff8a80; }
    .aviso-campo { color: #ffb4ab; font-size: 14px; font-weight: 600; margin-top: 8px; min-height: 20px; }
    .btn {
      width: 100%; min-height: 56px; margin-top: 10px; border: 0; border-radius: 12px;
      background: var(--green-vivid); color: var(--navy);
      font-size: 17px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform .15s var(--ease), background .15s;
    }
    .btn:active { transform: scale(.98); background: #00a832; }
    .btn-sec {
      background: #fff; color: var(--navy); border: 2px solid var(--navy);
    }

    .como { background: var(--ground); padding: 24px 20px 28px; }
    .como h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }

    /* ── SAUDAÇÃO / RESUMO ── */
    .resumo { background: var(--ground); padding: 18px 20px 16px; border-bottom: 1px solid var(--line); }
    .resumo h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
    .resumo p { font-size: 15px; color: var(--ink-2); margin-top: 2px; }

    /* ── SOLICITAÇÃO ── */
    .sol { background: var(--ground); margin-top: 10px; padding: 20px 20px 18px; }
    .sol-situacao {
      font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -.03em;
      color: var(--cor); text-wrap: balance;
    }
    .sol-id { font-size: 14px; color: var(--ink-2); margin-top: 8px; }
    .sol-id b { color: var(--ink); font-weight: 500; font-size: 16px; }
    .previsao {
      display: flex; align-items: center; gap: 10px;
      font-size: 16px; margin-top: 14px;
    }
    .previsao .icon { width: 22px; height: 22px; color: var(--ink-2); }
    .previsao b { font-weight: 700; }
    .liberado {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
      background: var(--mint); color: var(--green-dark);
      font-size: 15px; font-weight: 800; border-radius: 99px; padding: 6px 14px 6px 6px;
    }
    .liberado .bola {
      width: 26px; height: 26px; border-radius: 50%; background: var(--green-vivid); color: #fff;
      display: grid; place-items: center;
    }
    .liberado .icon { width: 16px; height: 16px; }
    .relato { margin-top: 16px; font-size: 16px; white-space: pre-line; }
    .relato-lbl { font-size: 14px; color: var(--ink-2); font-weight: 600; margin-bottom: 2px; }

    /* Trilho */
    .trilho { list-style: none; margin-top: 22px; }
    .etapa {
      display: grid; grid-template-columns: 30px 1fr; column-gap: 14px;
      position: relative; padding-bottom: 20px;
    }
    .etapa:last-child { padding-bottom: 0; }
    .etapa::before {
      content: ''; position: absolute; left: 13.5px; top: 30px; bottom: 0; width: 3px;
      background: var(--green-dark); transform-origin: top;
    }
    .etapa:last-child::before { display: none; }
    .etapa.atual::before, .etapa.futura::before {
      background: repeating-linear-gradient(var(--pending) 0 6px, transparent 6px 12px);
    }
    .marco {
      width: 30px; height: 30px; border-radius: 50%;
      display: grid; place-items: center; color: #fff;
      background: var(--green-dark); position: relative; z-index: 1;
    }
    .marco .icon { width: 17px; height: 17px; }
    .etapa.atual .marco { background: var(--cor); box-shadow: 0 0 0 6px color-mix(in srgb, var(--cor) 18%, transparent); }
    .etapa.futura .marco { background: #fff; border: 3px solid var(--pending); }
    .etapa-nome { font-size: 17px; font-weight: 700; padding-top: 3px; }
    .etapa.atual .etapa-nome { color: var(--cor); }
    .etapa.futura .etapa-nome { color: #6b747b; font-weight: 600; }
    .etapa-desc { font-size: 15px; color: var(--ink-2); }
    .etapa-data { font-family: var(--mono); font-size: 14px; color: var(--ink-2); }

    .recado {
      margin-top: 10px; background: var(--mint); border-radius: 12px;
      padding: 12px 14px; box-shadow: 0 1px 2px rgba(6, 119, 43, .12);
    }
    .recado-lbl {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 700; color: var(--green-dark); margin-bottom: 4px;
    }
    .recado-lbl .icon { width: 18px; height: 18px; }
    .recado-txt { font-size: 17px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }

    .sol-rodape {
      display: flex; flex-wrap: wrap; gap: 4px 16px;
      margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line);
      font-size: 14px; color: var(--ink-2);
    }

    /* Fechadas: recolhidas */
    details.sol { padding: 0; }
    details.sol > summary {
      list-style: none; padding: 16px 20px; min-height: 64px;
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
      cursor: pointer;
    }
    details.sol > summary::-webkit-details-marker { display: none; }
    .resumo-sit { font-size: 19px; font-weight: 800; color: var(--cor); }
    .resumo-id { font-size: 14px; color: var(--ink-2); grid-column: 1; }
    .resumo-seta { grid-row: 1 / span 2; grid-column: 2; color: var(--ink-2); transition: transform .2s var(--ease); }
    .resumo-seta .icon { width: 24px; height: 24px; }
    details[open] .resumo-seta { transform: rotate(180deg); }
    .det-corpo { padding: 0 20px 18px; }

    /* ── ESTADOS ── */
    .estado { background: var(--ground); text-align: center; padding: 48px 24px 52px; }
    .estado .icon { width: 44px; height: 44px; color: var(--ink-2); margin-bottom: 14px; }
    .estado h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; text-wrap: balance; }
    .estado p { font-size: 16px; color: var(--ink-2); max-width: 32ch; margin: 0 auto; }
    .estado .btn { max-width: 320px; margin: 20px auto 0; }
    .girando { animation: gira 1s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    .lenta { margin-top: 10px !important; font-weight: 600; color: var(--s-andamento) !important; }

    .historico { padding: 16px 20px 8px; }
    .historico .btn { margin: 0; }

    .rodape { text-align: center; font-size: 13px; color: var(--ink-2); padding: 28px 20px 36px; }

    /* ── MOVIMENTO: trilho se preenche até a etapa atual ── */
    @media (prefers-reduced-motion: no-preference) {
      .anima .etapa::before { animation: enche .5s var(--ease) both; animation-delay: calc(var(--i) * .14s); }
      .anima .etapa.atual .marco { animation: halo 1.2s var(--ease) both; animation-delay: calc(var(--i) * .14s + .1s); }
      @keyframes enche { from { transform: scaleY(0); } }
      @keyframes halo {
        0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--cor) 45%, transparent); }
        100% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--cor) 18%, transparent); }
      }
    }
  </style>
</head>

  <script>
    // URL do Apps Script publicado como app da Web (veja LEIAME.md).
    const API_URL = "https://script.google.com/macros/s/AKfycbwzzJpuq-Q8iwjhhasfr0dyXXf60FqpMQWzF_MqlK7MdtOvIIoulsR3R32KoNmimzckFA/exec";
    const DIAS_RECENTES = 30;
    const CHAVE_EMAIL = "portalMotorista.email";

    // As 6 Situações. "etapa" é a posição no trilho Recebida → Programada → Em andamento → Finalizada.
    const SITUACOES = [
      { nome: "Recebida",        chave: "recebida",   etapa: 0 },
      { nome: "Programada",      chave: "programada", etapa: 1 },
      { nome: "Em andamento",    chave: "andamento",  etapa: 2 },
      { nome: "Aguardando peça", chave: "aguardando", etapa: 2 },
      { nome: "Finalizada",      chave: "finalizada", etapa: 3 },
      { nome: "Cancelada",       chave: "cancelada",  etapa: 3 }
    ];
    const ETAPAS = ["Recebida", "Programada", "Em andamento", "Finalizada"];
    const FECHADAS = ["Finalizada", "Cancelada"];

    let todas = [];
    let veiculoAtivo = "todos";
    let mostrarHistorico = false;
    let animar = true;
    let buscaAtual = 0;         // só a busca mais recente pode mexer na tela
    let abortarBusca = null;

    const app = document.getElementById("app");
    const veiculosNav = document.getElementById("veiculos");
    const trocarBtn = document.getElementById("trocarBtn");

    function esc(v) {
      return String(v == null ? "" : v)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function icone(id) { return `<svg class="icon" aria-hidden="true"><use href="#i-${id}"/></svg>`; }

    function situacaoDe(d) { return SITUACOES.find(s => s.nome === d.situacao) || SITUACOES[0]; }
    function corDe(d) { return `var(--s-${situacaoDe(d).chave})`; }
    function ehAberta(d) { return !FECHADAS.includes(situacaoDe(d).nome); }
    function frotaDe(d) { return String(d.frota == null ? "" : d.frota).trim() || "Sem frota"; }
    function numeroDe(d) { return String(d.numero == null ? "" : d.numero).padStart(4, "0"); }

    // Aberta, ou fechada há no máximo 30 dias.
    function ehRecente(d) {
      if (ehAberta(d)) return true;
      const ref = d.dataConclusaoMs || d.ultimaAtualizacaoMs || d.dataCadastroMs || 0;
      return ref >= Date.now() - DIAS_RECENTES * 24 * 60 * 60 * 1000;
    }
    function visiveis() { return mostrarHistorico ? todas : todas.filter(ehRecente); }

    function lerEmail() { try { return localStorage.getItem(CHAVE_EMAIL) || ""; } catch (e) { return ""; } }
    function salvarEmail(v) { try { v ? localStorage.setItem(CHAVE_EMAIL, v) : localStorage.removeItem(CHAVE_EMAIL); } catch (e) {} }

    // ── Telas ──
    function telaEntrada(emailInicial, aviso) {
      todas = [];
      veiculosNav.hidden = true;
      trocarBtn.hidden = true;
      app.innerHTML = `
        <section class="entrada">
          <h1>Acompanhe suas Solicitações de Serviço</h1>
          <p>Consulte a Situação de cada Solicitação, a Previsão de Liberação e as Observações da manutenção.</p>
          <form id="formEmail" novalidate>
            <label for="emailInput">Seu e-mail (o mesmo do formulário)</label>
            <input class="campo" id="emailInput" type="email" inputmode="email" autocomplete="email"
                   autocapitalize="off" spellcheck="false" placeholder="nome@email.com"
                   value="${esc(emailInicial || "")}" ${aviso ? 'aria-invalid="true"' : ""} aria-describedby="avisoCampo">
            <div class="aviso-campo" id="avisoCampo" role="alert">${esc(aviso || "")}</div>
            <button class="btn" type="submit">Ver minhas Solicitações</button>
          </form>
        </section>
        <section class="como">
          <h2>Etapas de uma Solicitação</h2>
          <ol class="trilho">
            ${[["Recebida", "A Solicitação foi recebida pela manutenção."],
               ["Programada", "O serviço tem data programada."],
               ["Em andamento", "O serviço foi iniciado. Pode ficar em Aguardando peça."],
               ["Finalizada", "Serviço concluído."]].map(([n, t], i) => `
              <li class="etapa" style="--i:${i}">
                <span class="marco">${icone("check")}</span>
                <div><div class="etapa-nome">${n}</div><div class="etapa-desc">${t}</div></div>
              </li>`).join("")}
          </ol>
        </section>`;
      document.getElementById("formEmail").addEventListener("submit", e => {
        e.preventDefault();
        buscar(document.getElementById("emailInput").value);
      });
    }

    function telaEstado(icon, titulo, texto, acao) {
      app.innerHTML = `
        <section class="estado" aria-live="polite">
          ${icon}
          <h2>${titulo}</h2>
          <p>${texto}</p>
          ${acao || ""}
        </section>`;
    }

    function renderVeiculos(base) {
      const frotas = [...new Set(base.map(frotaDe))];
      if (frotas.length < 2) { veiculosNav.hidden = true; veiculoAtivo = "todos"; return; }
      // Veículos com Solicitação aberta primeiro; depois por número.
      const abertas = f => base.filter(d => frotaDe(d) === f && ehAberta(d)).length;
      frotas.sort((a, b) => (abertas(b) > 0) - (abertas(a) > 0) || a.localeCompare(b, "pt-BR", { numeric: true }));
      if (veiculoAtivo !== "todos" && !frotas.includes(veiculoAtivo)) veiculoAtivo = "todos";

      const totalAbertas = base.filter(ehAberta).length;
      const abas = [{ id: "todos", rotulo: "Todos", n: totalAbertas }]
        .concat(frotas.map(f => ({ id: f, rotulo: f, n: abertas(f) })));
      veiculosNav.innerHTML = abas.map(a => `
        <button class="aba" type="button" data-veiculo="${esc(a.id)}" aria-pressed="${veiculoAtivo === a.id}"
                aria-label="${a.id === "todos" ? "Todos os veículos" : "Frota " + esc(a.rotulo)}, ${a.n} aberta${a.n !== 1 ? "s" : ""}">
          ${esc(a.rotulo)}${a.n ? `<span class="qtd" aria-hidden="true">${a.n}</span>` : ""}
        </button>`).join("");
      veiculosNav.hidden = false;
    }

    function renderTrilho(d) {
      const sit = situacaoDe(d);
      const cancelada = sit.nome === "Cancelada";
      const finalizada = sit.nome === "Finalizada";
      const etapas = cancelada
        ? [{ nome: "Recebida", data: d.dataCadastro }, { nome: "Cancelada", data: d.ultimaAtualizacao, atual: true }]
        : ETAPAS.map((nome, i) => {
            const e = { nome };
            if (i === 0) e.data = d.dataCadastro;
            if (i === 1) e.data = d.dataProgramada ? (sit.etapa <= 1 ? "marcada para " : "") + d.dataProgramada : "";
            if (i === 2 && d.tecnico) e.extra = "com " + d.tecnico;
            if (i === 3) e.data = d.dataConclusao || (d.previsaoLiberacao ? "previsão " + d.previsaoLiberacao : "");
            if (i === sit.etapa) { e.atual = true; e.nome = sit.nome; if (!finalizada && !e.data && d.ultimaAtualizacao) e.data = "desde " + d.ultimaAtualizacao; }
            if (i > sit.etapa) e.futura = true;
            return e;
          });

      return `<ol class="trilho">${etapas.map((e, i) => {
        const classe = e.atual && !finalizada ? "atual" : e.futura ? "futura" : "";
        const marco = e.futura ? "" : cancelada && e.atual ? icone("x")
          : e.atual && sit.chave === "aguardando" ? icone("pausa")
          : e.atual && !finalizada ? icone("chave") : icone("check");
        const recado = e.atual && d.observacoes ? `
          <div class="recado">
            <div class="recado-lbl">${icone("recado")}Recado da manutenção</div>
            <div class="recado-txt">${esc(d.observacoes)}</div>
          </div>` : "";
        return `
          <li class="etapa ${classe}" style="--i:${i}">
            <span class="marco">${marco}</span>
            <div>
              <div class="etapa-nome">${esc(e.nome)}</div>
              ${e.data ? `<div class="etapa-data">${esc(e.data)}</div>` : ""}
              ${e.extra ? `<div class="etapa-data">${esc(e.extra)}</div>` : ""}
              ${recado}
            </div>
          </li>`;
      }).join("")}</ol>`;
    }

    function corpoSolicitacao(d) {
      return `
        ${!FECHADAS.includes(situacaoDe(d).nome) && d.previsaoLiberacao ? `
          <div class="previsao">${icone("cal")}<span>Previsão de liberação <b class="mono">${esc(d.previsaoLiberacao)}</b></span></div>` : ""}
        ${d.veiculoLiberado ? `<div class="liberado"><span class="bola">${icone("check")}</span>Veículo liberado para uso</div>` : ""}
        ${d.problema ? `<div class="relato"><div class="relato-lbl">Problema relatado</div>${esc(d.problema)}</div>` : ""}
        ${renderTrilho(d)}`;
    }

    function idSolicitacao(d) {
      return `Frota <b class="mono">${esc(frotaDe(d))}</b> · Nº <span class="mono">${esc(numeroDe(d))}</span>${d.dataCadastro ? ` · aberta em <span class="mono">${esc(d.dataCadastro)}</span>` : ""}`;
    }

    function renderAberta(d) {
      return `
        <article class="sol" style="--cor:${corDe(d)}">
          <h2 class="sol-situacao">${esc(situacaoDe(d).nome)}</h2>
          <div class="sol-id">${idSolicitacao(d)}</div>
          ${corpoSolicitacao(d)}
          ${d.ultimaAtualizacao ? `<div class="sol-rodape"><span>Atualizado em <span class="mono">${esc(d.ultimaAtualizacao)}</span></span></div>` : ""}
        </article>`;
    }

    function renderFechada(d) {
      return `
        <details class="sol" style="--cor:${corDe(d)}">
          <summary>
            <span class="resumo-sit">${esc(situacaoDe(d).nome)}${d.dataConclusao ? ` <span class="mono" style="font-weight:500;font-size:16px">em ${esc(d.dataConclusao)}</span>` : ""}</span>
            <span class="resumo-id">${idSolicitacao(d)}</span>
            <span class="resumo-seta">${icone("seta")}</span>
          </summary>
          <div class="det-corpo">${corpoSolicitacao(d)}</div>
        </details>`;
    }

    function renderTudo() {
      const base = visiveis();
      renderVeiculos(base);
      const lista = veiculoAtivo === "todos" ? base : base.filter(d => frotaDe(d) === veiculoAtivo);
      // Abertas: a atualizada mais recentemente primeiro.
      const abertas = lista.filter(ehAberta).sort((a, b) => (b.ultimaAtualizacaoMs || b.dataCadastroMs || 0) - (a.ultimaAtualizacaoMs || a.dataCadastroMs || 0));
      const fechadas = lista.filter(d => !ehAberta(d));

      const nome = (todas.find(d => d.nome) || {}).nome;
      const primeiro = nome ? String(nome).trim().split(/\s+/)[0] : "";
      const partes = [];
      partes.push(abertas.length ? `${abertas.length} aberta${abertas.length !== 1 ? "s" : ""}` : "Nenhuma aberta");
      const nF = fechadas.length;
      if (nF) partes.push(`${nF} ${nF !== 1 ? "fechadas" : "fechada"}${mostrarHistorico ? "" : " nos últimos 30 dias"}`);

      const doVeiculo = veiculoAtivo === "todos" ? todas : todas.filter(d => frotaDe(d) === veiculoAtivo);
      const antigas = doVeiculo.filter(d => !ehRecente(d)).length;
      const historico = antigas > 0 || mostrarHistorico ? `
        <div class="historico">
          <button class="btn btn-sec" type="button" id="historicoBtn">
            ${mostrarHistorico ? "Mostrar só as recentes" : `Ver histórico completo (+${antigas} antiga${antigas !== 1 ? "s" : ""})`}
          </button>
        </div>` : "";

      app.innerHTML = `
        <section class="resumo">
          <h1>Olá${primeiro ? ", " + esc(primeiro) : ""}</h1>
          <p>${veiculoAtivo === "todos" ? "" : `Frota <span class="mono">${esc(veiculoAtivo)}</span>: `}${partes.join(" · ")}</p>
        </section>
        <div class="${animar ? "anima" : ""}">
          ${abertas.map(renderAberta).join("")}
          ${fechadas.map(renderFechada).join("")}
        </div>
        ${!lista.length ? `<section class="estado">${icone("vazio")}<h2>Nenhuma Solicitação para exibir</h2><p>Nenhuma Solicitação aberta nem dos últimos 30 dias.</p></section>` : ""}
        ${historico}`;
      animar = false;

      const hb = document.getElementById("historicoBtn");
      if (hb) hb.addEventListener("click", () => { mostrarHistorico = !mostrarHistorico; animar = true; renderTudo(); });
    }

    veiculosNav.addEventListener("click", e => {
      const b = e.target.closest(".aba");
      if (!b) return;
      veiculoAtivo = b.dataset.veiculo;
      animar = true;
      renderTudo();
      window.scrollTo({ top: 0 });
    });

    function cancelarBusca() {
      buscaAtual++;
      if (abortarBusca) { abortarBusca(); abortarBusca = null; }
    }

    trocarBtn.addEventListener("click", () => {
      cancelarBusca();
      salvarEmail("");
      telaEntrada("");
      document.getElementById("emailInput").focus();
    });

    async function buscar(emailBruto) {
      const email = String(emailBruto || "").trim();
      if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
        telaEntrada(email, email ? "E-mail inválido. Verifique o endereço digitado." : "Informe o seu e-mail para continuar.");
        document.getElementById("emailInput").focus();
        return;
      }

      cancelarBusca();
      const minha = buscaAtual;
      veiculosNav.hidden = true;
      trocarBtn.hidden = false;
      telaEstado(`<svg class="icon girando" aria-hidden="true"><use href="#i-roda"/></svg>`,
        "Buscando suas Solicitações", `<span class="mono">${esc(email)}</span>`);
      const lenta = setTimeout(() => {
        const p = app.querySelector(".estado p");
        if (p) p.insertAdjacentHTML("afterend", '<p class="lenta">A conexão está lenta. Por favor, aguarde.</p>');
      }, 6000);

      const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      if (ctrl) abortarBusca = () => ctrl.abort();
      const limite = ctrl ? setTimeout(() => ctrl.abort(), 40000) : null;

      try {
        const resp = await fetch(API_URL + "?email=" + encodeURIComponent(email), ctrl ? { signal: ctrl.signal } : {});
        const data = await resp.json();
        const lista = Array.isArray(data) ? data : (data.solicitacoes || []);
        if (minha !== buscaAtual) return;
        if (!lista.length) {
          salvarEmail("");
          telaEstado(icone("vazio"), "Nenhuma Solicitação encontrada",
            `Não há Solicitações para <span class="mono">${esc(email)}</span>. Verifique se é o mesmo e-mail informado no formulário.`,
            '<button class="btn btn-sec" type="button" id="outroEmail">Usar outro e-mail</button>');
          document.getElementById("outroEmail").addEventListener("click", () => trocarBtn.click());
          return;
        }

        salvarEmail(email);
        todas = lista.slice().sort((a, b) => (b.dataCadastroMs || 0) - (a.dataCadastroMs || 0));
        veiculoAtivo = "todos";
        mostrarHistorico = false;
        animar = true;
        renderTudo();
      } catch (e) {
        if (minha !== buscaAtual) return;
        telaEstado(icone("alerta"), "Não foi possível carregar",
          "Verifique a sua conexão com a internet e tente novamente.",
          '<button class="btn" type="button" id="tentarBtn">Tentar novamente</button>');
        document.getElementById("tentarBtn").addEventListener("click", () => buscar(email));
      } finally {
        if (minha === buscaAtual) abortarBusca = null;
        clearTimeout(lenta);
        if (limite) clearTimeout(limite);
      }
    }

    const salvo = lerEmail();
    if (salvo) buscar(salvo); else telaEntrada("");
  </script>
</body>
</html>
