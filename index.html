<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Motorista · Tropical Transportes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-dark:   #06772b;
      --green-vivid:  #00c038;
      --green-mid:    #06772b;
      --navy:         #1c2a3a;
      --gray:         #585E63;
      --sage:         #c7d291;
      --mint:         #edfff2;
      --white:        #ffffff;
      --bg:           #f4f7f4;
      --card-border:  #e2ebe3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--navy);
    }

    /* ── HEADER ── */
    .header {
      background: var(--navy);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(28,42,58,0.18);
    }
    .header-logo {
      height: 32px;
      width: auto;
      display: block;
    }
    .header-badge {
      background: rgba(0,192,56,0.15);
      border: 1px solid rgba(0,192,56,0.3);
      color: #00c038;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 99px;
      text-transform: uppercase;
    }

    /* ── HERO SEARCH ── */
    .hero {
      background: linear-gradient(135deg, var(--navy) 0%, #0f3d1f 100%);
      padding: 36px 20px 32px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,192,56,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -40px; left: -40px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6,119,43,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 4px;
      position: relative;
    }
    .hero-sub {
      font-size: 13px;
      color: rgba(237,255,242,0.65);
      margin-bottom: 20px;
      font-weight: 300;
      position: relative;
    }
    .search-box {
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 14px 16px;
      position: relative;
      backdrop-filter: blur(8px);
    }
    .search-box label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: rgba(237,255,242,0.5);
      margin-bottom: 8px;
    }
    .search-row {
      display: flex;
      gap: 8px;
    }
    .search-input {
      flex: 1;
      height: 44px;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      color: var(--white);
      font-family: 'DM Mono', monospace;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.35); }
    .search-input:focus {
      border-color: var(--green-vivid);
      background: rgba(0,192,56,0.08);
    }
    .search-btn {
      height: 44px;
      padding: 0 18px;
      background: var(--green-vivid);
      color: var(--navy);
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Sora', sans-serif;
      letter-spacing: 0.02em;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .search-btn:active { transform: scale(0.97); background: #00a832; }

    /* ── STATS ── */
    .stats-wrap { padding: 16px 16px 4px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .stat-card {
      background: var(--white);
      border-radius: 12px;
      border: 1.5px solid var(--card-border);
      padding: 12px 8px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s;
      position: relative;
      overflow: hidden;
    }
    .stat-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 0 0 12px 12px;
      background: var(--stat-color);
      opacity: 0;
      transition: opacity 0.18s;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(28,42,58,0.1); }
    .stat-card.active { border-color: var(--stat-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--stat-color) 15%, transparent); }
    .stat-card.active::after { opacity: 1; }
    .stat-num { font-size: 24px; font-weight: 700; color: var(--stat-color); line-height: 1; }
    .stat-lbl { font-size: 9px; color: var(--gray); margin-top: 3px; font-weight: 500; letter-spacing: 0; text-transform: uppercase; overflow-wrap: anywhere; }

    /* ── FILTROS ── */
    .filters-wrap { padding: 0 16px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-pill {
      height: 30px;
      padding: 0 12px;
      border-radius: 99px;
      border: 1.5px solid var(--card-border);
      background: var(--white);
      font-size: 12px;
      font-weight: 600;
      color: var(--gray);
      cursor: pointer;
      font-family: 'Sora', sans-serif;
      transition: all 0.15s;
    }
    .filter-pill:hover { border-color: var(--green-mid); color: var(--green-mid); }
    .filter-pill.active {
      background: var(--pill-color, var(--navy));
      border-color: var(--pill-color, var(--navy));
      color: white;
    }

    /* ── SECTION LABEL ── */
    .section-lbl {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray);
      padding: 4px 20px 10px;
    }

    /* ── CARD ── */
    .card {
      background: var(--white);
      margin: 0 16px 10px;
      border-radius: 16px;
      border: 1.5px solid var(--card-border);
      overflow: hidden;
      transition: box-shadow 0.18s, transform 0.18s;
      animation: fadeUp 0.3s ease both;
    }
    .card:hover { box-shadow: 0 6px 24px rgba(28,42,58,0.09); transform: translateY(-1px); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      background: linear-gradient(90deg, var(--navy) 0%, #0f3220 100%);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .frota-group {}
    .frota-eyebrow {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(237,255,242,0.5);
      margin-bottom: 2px;
    }
    .frota-num {
      font-size: 26px;
      font-weight: 700;
      color: var(--white);
      font-family: 'DM Mono', monospace;
      line-height: 1;
    }
    .frota-accent {
      width: 6px;
      height: 6px;
      background: var(--green-vivid);
      border-radius: 50%;
      display: inline-block;
      margin-left: 4px;
      vertical-align: middle;
      margin-bottom: 2px;
    }
    .card-id-date {
      text-align: right;
    }
    .card-id {
      font-size: 11px;
      font-weight: 600;
      color: rgba(237,255,242,0.4);
      font-family: 'DM Mono', monospace;
    }
    .card-date {
      font-size: 12px;
      color: rgba(237,255,242,0.7);
      margin-top: 2px;
    }

    .card-body { padding: 14px 16px; }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.45;
      margin-bottom: 6px;
    }
    .card-odo {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: var(--gray);
      background: var(--mint);
      border-radius: 6px;
      padding: 3px 8px;
      margin-bottom: 10px;
      font-family: 'DM Mono', monospace;
    }
    .card-detail {
      background: #f8faf8;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .card-detail-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 12px;
      color: var(--gray);
      padding: 2px 0;
    }
    .card-detail-row strong { color: var(--navy); font-weight: 600; }
    .card-detail-row .dot {
      width: 4px; height: 4px;
      background: var(--sage);
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }
    .card-obs {
      background: linear-gradient(90deg, rgba(199,210,145,0.2) 0%, transparent 100%);
      border-left: 3px solid var(--sage);
      border-radius: 0 8px 8px 0;
      padding: 8px 12px;
      font-size: 12px;
      color: #4a5a2a;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* ── BADGES STATUS ── */
    .badge {
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 99px;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.7;
    }
    .badge-recebida    { background: #f0f2f0; color: #585E63; }
    .badge-programada  { background: #e6f1fb; color: #1557a0; }
    .badge-andamento   { background: #fff3e0; color: #b45309; }
    .badge-aguardando  { background: #fde8e8; color: #b91c1c; }
    .badge-finalizada  { background: #e8f5e9; color: #1b6b27; }
    .badge-cancelada   { background: #eceff1; color: #455a64; text-decoration: line-through; }

    .card-atualizado {
      font-size: 11px;
      color: var(--gray);
      margin-top: 8px;
    }

    /* ── RECADO DA MANUTENÇÃO ── */
    .card-recado {
      background: var(--mint);
      border: 1px solid #bfe8cb;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .card-recado-lbl {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--green-dark);
      margin-bottom: 4px;
    }
    .card-recado-txt {
      font-size: 13px;
      color: var(--navy);
      line-height: 1.5;
      white-space: pre-line;
    }

    /* ── HISTÓRICO ── */
    .historico-wrap { padding: 4px 16px 8px; }
    .historico-btn {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      border: 1.5px dashed var(--card-border);
      background: transparent;
      color: var(--navy);
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .historico-btn:hover { border-color: var(--green-mid); color: var(--green-mid); }
    .card-title { white-space: pre-line; }

    .liberado {
      font-size: 11px;
      font-weight: 700;
      color: var(--green-dark);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .liberado::before {
      content: '✓';
      width: 16px; height: 16px;
      background: var(--green-vivid);
      color: white;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }

    /* ── ESTADOS VAZIOS ── */
    .state-msg {
      text-align: center;
      padding: 52px 24px;
      color: var(--gray);
    }
    .state-msg .icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    .state-msg p { font-size: 14px; line-height: 1.6; }
    .state-msg small { font-size: 12px; opacity: 0.7; }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      padding: 24px 20px;
      font-size: 11px;
      color: var(--gray);
      opacity: 0.6;
      border-top: 1px solid var(--card-border);
      margin-top: 8px;
    }

    /* Stagger animation nos cards */
    .card:nth-child(1) { animation-delay: 0.03s; }
    .card:nth-child(2) { animation-delay: 0.07s; }
    .card:nth-child(3) { animation-delay: 0.11s; }
    .card:nth-child(4) { animation-delay: 0.15s; }
    .card:nth-child(5) { animation-delay: 0.19s; }
  </style>
</head>

  <!-- HERO SEARCH -->
  <div class="hero">
    <div class="hero-title">Minhas Solicitações</div>
    <div class="hero-sub">Acompanhe a situação dos seus pedidos de serviço</div>
    <div class="search-box">
      <label>Seu e-mail cadastrado no formulário</label>
      <div class="search-row">
        <input class="search-input" type="email" id="emailInput" placeholder="seu@email.com" />
        <button class="search-btn" onclick="buscar()">Buscar</button>
      </div>
    </div>

  <!-- FILTROS -->
  <div id="statsBlock" style="display:none">
    <div class="stats-wrap">
      <div class="stats-grid">
        <div class="stat-card" style="--stat-color:#1557a0" data-stat="programada" onclick="setFiltro('programada')">
          <div class="stat-num">0</div>
          <div class="stat-lbl">Programada</div>
        </div>
        <div class="stat-card" style="--stat-color:#b45309" data-stat="andamento" onclick="setFiltro('andamento')">
          <div class="stat-num">0</div>
          <div class="stat-lbl">Andamento</div>
        </div>
        <div class="stat-card" style="--stat-color:#b91c1c" data-stat="aguardando" onclick="setFiltro('aguardando')">
          <div class="stat-num">0</div>
          <div class="stat-lbl">Aguard. peça</div>
        </div>
        <div class="stat-card" style="--stat-color:#1b6b27" data-stat="finalizada" onclick="setFiltro('finalizada')">
          <div class="stat-num">0</div>
          <div class="stat-lbl">Finalizada</div>
        </div>
      </div>
    </div>
    <div class="filters-wrap" id="filtros"></div>
  </div>

  <div id="results">
    <div class="state-msg">
      <div class="icon">🔍</div>
      <p>Insira seu e-mail acima<br>para ver suas solicitações.</p>
    </div>
  </div>

  <div class="historico-wrap" id="historicoWrap" style="display:none">
    <button class="historico-btn" id="historicoBtn" onclick="alternarHistorico()"></button>
  </div>

  <div class="footer">© Tropical Transportes · Portal de Manutenção</div>

  <script>
    // URL do Apps Script publicado como app da Web (veja LEIAME.md).
    const API_URL = "https://script.google.com/macros/s/AKfycbwzzJpuq-Q8iwjhhasfr0dyXXf60FqpMQWzF_MqlK7MdtOvIIoulsR3R32KoNmimzckFA/exec";
    const DIAS_RECENTES = 30;

    // As 6 Situações. A chave é usada nas classes CSS e nos filtros.
    const SITUACOES = [
      { nome: "Recebida",        chave: "recebida",   cor: "#585E63" },
      { nome: "Programada",      chave: "programada", cor: "#1557a0" },
      { nome: "Em andamento",    chave: "andamento",  cor: "#b45309" },
      { nome: "Aguardando peça", chave: "aguardando", cor: "#b91c1c" },
      { nome: "Finalizada",      chave: "finalizada", cor: "#1b6b27" },
      { nome: "Cancelada",       chave: "cancelada",  cor: "#455a64" }
    ];
    const FECHADAS = ["Finalizada", "Cancelada"];

    let todas = [];
    let filtroAtivo = "todos";
    let mostrarHistorico = false;

    function chaveDe(situacao) {
      const s = SITUACOES.find(x => x.nome === situacao);
      return s ? s.chave : "recebida";
    }

    function esc(v) {
      return String(v == null ? "" : v)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function ehAberta(d) { return !FECHADAS.includes(d.situacao); }

    // Aberta, ou fechada há no máximo 30 dias.
    function ehRecente(d) {
      if (ehAberta(d)) return true;
      const ref = d.dataConclusaoMs || d.ultimaAtualizacaoMs || d.dataCadastroMs || 0;
      return ref >= Date.now() - DIAS_RECENTES * 24 * 60 * 60 * 1000;
    }

    function visiveis() {
      return mostrarHistorico ? todas : todas.filter(ehRecente);
    }

    function setFiltro(filtro) {
      filtroAtivo = filtro;
      renderTudo();
    }

    function alternarHistorico() {
      mostrarHistorico = !mostrarHistorico;
      filtroAtivo = "todos";
      renderTudo();
    }

    function renderFiltros(base) {
      const pills = [{ nome: "Todas", chave: "todos", cor: "var(--navy)" }]
        .concat(SITUACOES.filter(s => base.some(d => chaveDe(d.situacao) === s.chave)));
      document.getElementById("filtros").innerHTML = pills.map(p => {
        const n = p.chave === "todos" ? base.length : base.filter(d => chaveDe(d.situacao) === p.chave).length;
        return `<button class="filter-pill${filtroAtivo === p.chave ? " active" : ""}" style="--pill-color:${p.cor}"
                  onclick="setFiltro('${p.chave}')">${esc(p.nome)} · ${n}</button>`;
      }).join("");

      document.querySelectorAll(".stat-card").forEach(c => {
        const k = c.dataset.stat;
        c.querySelector(".stat-num").textContent = base.filter(d => chaveDe(d.situacao) === k).length;
        c.classList.toggle("active", filtroAtivo === k);
      });
    }

    function renderCard(d) {
      const sk = chaveDe(d.situacao);
      const detalhes = [
        d.dataProgramada    && ["Data programada", d.dataProgramada],
        d.previsaoLiberacao && ["Previsão de liberação", d.previsaoLiberacao],
        d.dataConclusao     && ["Finalizada em", d.dataConclusao],
        d.tecnico           && ["Técnico responsável", d.tecnico]
      ].filter(Boolean);

      return `
        <div class="card">
          <div class="card-header">
            <div class="frota-group">
              <div class="frota-eyebrow">Nº de Frota</div>
              <div class="frota-num">${esc(d.frota || "—")}<span class="frota-accent"></span></div>
            </div>
            <div class="card-id-date">
              <div class="card-id">#${esc(String(d.numero).padStart(4, "0"))}</div>
              <div class="card-date">${esc(d.dataCadastro)}</div>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title">${esc(d.problema || "Solicitação de serviço")}</div>
            ${d.odometro ? `<div class="card-odo">⬤ ${esc(d.odometro)} km</div>` : ""}
            ${d.observacoes ? `
              <div class="card-recado">
                <div class="card-recado-lbl">💬 Recado da manutenção</div>
                <div class="card-recado-txt">${esc(d.observacoes)}</div>
              </div>` : ""}
            ${detalhes.length ? `<div class="card-detail">${detalhes.map(([rot, val]) =>
              `<div class="card-detail-row"><span class="dot"></span><span>${rot}: <strong>${esc(val)}</strong></span></div>`
            ).join("")}</div>` : ""}
            <div class="card-footer">
              <span class="badge badge-${sk}">${esc(d.situacao)}</span>
              ${d.veiculoLiberado ? '<span class="liberado">Veículo liberado</span>' : ""}
            </div>
            ${d.ultimaAtualizacao ? `<div class="card-atualizado">Atualizado em ${esc(d.ultimaAtualizacao)}</div>` : ""}
          </div>
        </div>`;
    }

    function renderTudo() {
      const res = document.getElementById("results");
      const base = visiveis();
      renderFiltros(base);

      const lista = filtroAtivo === "todos" ? base : base.filter(d => chaveDe(d.situacao) === filtroAtivo);
      const nome = todas[0] && todas[0].nome ? todas[0].nome.trim().split(" ")[0] : "";
      const titulo = mostrarHistorico ? "Histórico completo" : "Abertas e últimos 30 dias";

      if (!lista.length) {
        res.innerHTML = `<div class="section-lbl">Olá${nome ? ", " + esc(nome) : ""} · ${titulo}</div>` +
          '<div class="state-msg"><div class="icon">📭</div><p>' +
          (base.length ? "Nenhuma solicitação<br>com esta situação." : "Nenhuma solicitação aberta<br>nem dos últimos 30 dias.") +
          "</p></div>";
      } else {
        res.innerHTML =
          `<div class="section-lbl">Olá${nome ? ", " + esc(nome) : ""} · ${titulo} · ${lista.length} solicitaç${lista.length !== 1 ? "ões" : "ão"}</div>` +
          lista.map(renderCard).join("");
      }

      const antigas = todas.length - todas.filter(ehRecente).length;
      const wrap = document.getElementById("historicoWrap");
      wrap.style.display = antigas > 0 || mostrarHistorico ? "block" : "none";
      document.getElementById("historicoBtn").textContent = mostrarHistorico
        ? "Mostrar só as recentes"
        : `Ver histórico completo (+${antigas} antiga${antigas !== 1 ? "s" : ""})`;
    }

    async function buscar() {
      const email = document.getElementById("emailInput").value.trim();
      if (!email) { alert("Por favor, insira seu e-mail."); return; }

      const res = document.getElementById("results");
      res.innerHTML = '<div class="state-msg"><div class="icon">⏳</div><p>Buscando suas solicitações...</p></div>';
      document.getElementById("statsBlock").style.display = "none";
      document.getElementById("historicoWrap").style.display = "none";
      todas = [];
      filtroAtivo = "todos";
      mostrarHistorico = false;

      try {
        const resp = await fetch(API_URL + "?email=" + encodeURIComponent(email));
        const data = await resp.json();
        const lista = Array.isArray(data) ? data : (data.solicitacoes || []);

        if (!lista.length) {
          res.innerHTML = '<div class="state-msg"><div class="icon">📭</div><p>Nenhuma solicitação encontrada.<br><small>Verifique se o e-mail é o mesmo do formulário.</small></p></div>';
          return;
        }

        todas = lista.slice().sort((a, b) => (b.dataCadastroMs || 0) - (a.dataCadastroMs || 0));
        document.getElementById("statsBlock").style.display = "block";
        renderTudo();
      } catch (e) {
        res.innerHTML = '<div class="state-msg"><div class="icon">⚠️</div><p>Erro ao buscar dados.<br><small>Verifique sua conexão e tente novamente.</small></p></div>';
      }
    }

    document.getElementById("emailInput").addEventListener("keypress", e => {
      if (e.key === "Enter") buscar();
    });
  </script>
</body>
</html>
